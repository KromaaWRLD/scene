<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scene</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h2>Welcome to Scene</h2>
            <input type="text" id="auth-username" placeholder="Username (or User#0000)">
            <input type="password" id="auth-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <button onclick="register()" class="secondary">Create Account</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="screen hidden app-container">
        
        <!-- Far Left: Server List -->
        <nav class="server-list">
            <div id="servers-container"></div>
            <div class="server-icon add-server" onclick="showModal('server-modal')">+</div>
        </nav>

        <!-- Middle: Channel List -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2 id="current-server-name">Select a Server</h2>
            </div>
            <div class="channel-list" id="channels-container"></div>
            <div id="add-channel-btn" class="add-channel hidden" onclick="showModal('channel-modal')">+ Add Channel (Owner)</div>
            
            <div class="user-panel">
                <div class="avatar">U</div>
                <div class="user-info">
                    <div id="my-username">Username</div>
                    <div id="my-discriminator">#0000</div>
                </div>
                <button onclick="logout()">Log Out</button>
            </div>
        </nav>

        <!-- Right: Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h3 id="current-channel-name"># general</h3>
            </header>
            <div class="messages-container" id="messages-container"></div>
            <div class="input-area">
                <form id="message-form">
                    <input type="text" id="message-input" placeholder="Send a message..." autocomplete="off" disabled>
                </form>
            </div>
        </main>
    </div>

    <!-- MODALS -->
    <div id="server-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Create a Server</h3>
            <input type="text" id="new-server-name" placeholder="Server Name">
            <button onclick="createServer()">Create</button>
            <button onclick="hideModal('server-modal')">Cancel</button>
        </div>
    </div>

    <div id="channel-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Create a Channel</h3>
            <input type="text" id="new-channel-name" placeholder="Channel Name">
            <button onclick="createChannel()">Create</button>
            <button onclick="hideModal('channel-modal')">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
